
name: go-source-insight

services:
  # Invoke with compose run --rm insight <command>; this is a CLI, not an HTTP server.
  insight:
    profiles: [cli]
    build: .
    image: go-source-insight:local
    command: [help]
    environment:
      GO_AI_INSIGHT_OLLAMA_ENDPOINT: http://ollama:11434
      GO_AI_INSIGHT_MILVUS_ENDPOINT: milvus:19530
      GO_AI_INSIGHT_EMBEDDING_MODEL: ${GO_AI_INSIGHT_EMBEDDING_MODEL:-bge-m3:latest}
      GO_AI_INSIGHT_CHAT_MODEL: ${GO_AI_INSIGHT_CHAT_MODEL:-llama3:latest}
      GO_AI_INSIGHT_COLLECTION: ${GO_AI_INSIGHT_COLLECTION:-code_segments}
      GO_AI_INSIGHT_VECTOR_DIM: ${GO_AI_INSIGHT_VECTOR_DIM:-1024}
      GO_AI_INSIGHT_TOP_K: ${GO_AI_INSIGHT_TOP_K:-3}
      GO_AI_INSIGHT_CHUNK_MAX_LINES: ${GO_AI_INSIGHT_CHUNK_MAX_LINES:-120}
      GO_AI_INSIGHT_CHUNK_MIN_LINES: ${GO_AI_INSIGHT_CHUNK_MIN_LINES:-5}
      GO_AI_INSIGHT_TIMEOUT_SECONDS: ${GO_AI_INSIGHT_TIMEOUT_SECONDS:-300}
    volumes:
      - type: bind
        source: ${SOURCE_DIR:-.}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false

  ollama:
    image: ollama/ollama:0.11.11
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

  # Explicit one-shot initialization; deploy scripts wait for its exit status.
  models:
    profiles: [setup]
    image: ollama/ollama:0.11.11
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for model in "$$GO_AI_INSIGHT_EMBEDDING_MODEL" "$$GO_AI_INSIGHT_CHAT_MODEL"; do
          if ollama show "$$model" >/dev/null 2>&1; then
            echo "Using cached model: $$model"
          else
            echo "Downloading missing model: $$model"
            ollama pull "$$model"
          fi
        done
        echo "Models are ready."
    environment:
      OLLAMA_HOST: http://ollama:11434
      GO_AI_INSIGHT_EMBEDDING_MODEL: ${GO_AI_INSIGHT_EMBEDDING_MODEL:-bge-m3:latest}
      GO_AI_INSIGHT_CHAT_MODEL: ${GO_AI_INSIGHT_CHAT_MODEL:-llama3:latest}
    depends_on:
      ollama:
        condition: service_healthy

  # Official standalone mode: embedded etcd and local object storage.
  milvus:
    image: milvusdb/milvus:v2.5.27
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
      - type: bind
        source: ./scripts/milvus-embedded-etcd.yaml
        target: /milvus/configs/embedEtcd.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 24

# Model weights and database state persist across compose down/up.
volumes:
  ollama_data:
  milvus_data:
